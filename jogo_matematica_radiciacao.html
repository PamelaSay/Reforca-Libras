<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Radiciação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="jogo_matematica_radiciacao.css">
</head>
<body>
  <header class="topo">
    <button class="btn-voltar" type="button" onclick="window.history.back()" aria-label="Voltar" title="Voltar">
      <img src="botao_retornar.png" alt="" class="imagem-voltar">
    </button>

    <div class="box-topo">
      <strong>🏆 <span id="pontos">0</span></strong>
      <p>PONTOS</p>
    </div>

    <h1 class="titulo">⭐ Jogo da Radiciação ⭐</h1>

    <div class="box-topo">
      <strong><span id="fase">1</span>/10</strong>
      <p>FASE</p>
    </div>
  </header>

  <main>
    <section class="conteudo">
      <aside class="avatar-area">
        <div class="fala" id="instrucao">Observe a representação e responda:</div>
        <div id="avatar" class="avatar-fallback" role="img" aria-label="Sinal de Libras">🤟</div>
      </aside>

      <section class="pergunta-area" aria-live="polite">
        <span class="etiqueta">DESAFIO</span>
        <h2 id="textoPergunta">Carregando pergunta...</h2>
        <div id="quadrado" aria-label="Representação visual da quantidade"></div>
      </section>

      <aside class="libras">
        <h2>✋ Tradução em Libras</h2>
        <video id="videoLibras" muted playsinline preload="metadata" hidden>
          <source id="fonteLibras" src="" type="video/mp4">
          Seu navegador não reproduz vídeos.
        </video>
        <p id="avisoLibras" class="aviso-libras">Vídeo em Libras ainda não disponível.</p>
        <button id="repetirLibras" type="button">↻ Repetir tradução</button>
      </aside>
    </section>

    <section id="alternativas" class="alternativas" aria-label="Alternativas"></section>

    <footer class="rodape">
      <button class="menu" type="button" onclick="window.history.back()">← Sair do jogo</button>

      <div class="progresso-area">
        <p>PROGRESSO</p>
        <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <div id="progresso"></div>
        </div>
      </div>

      <div class="vidas" aria-label="Vidas restantes">❤️ <span id="vidas">3</span></div>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="storage-utils.js"></script>
  <script src="jogo_matematica_radiciacao.js"></script>
</body>
</html>
