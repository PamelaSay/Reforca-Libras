<!-- jogos/potencia.html -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Missão Potência</title>
    <link rel="stylesheet" href="potencia.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

    <!-- TOPO -->

    <header class="topo">

    <button
        type="button" class="btn-voltar" onclick="window.history.back()" aria-label="Voltar" title="Voltar" >
        <img src="botao_retornar.png" alt="voltar" class="btn-voltar-img" >
    </button>

    <h1>⚡ Missão Potência</h1>

</header>

    <!-- CONTAINER -->

    <main class="container">

        <!-- STATUS -->

        <section class="status">

            <div class="status-box">

                ⭐ Pontos:
                <span id="pontos">0</span>

            </div>

            <div class="status-box">

                ❤️ Vidas:
                <span id="vidas">3</span>

            </div>

            <div class="status-box">

                🎯 Fase:
                <span id="fase">1</span>

            </div>

        </section>

        <!-- QUIZ -->

        <section class="quiz-box">

            <h2 id="pergunta">

                Carregando pergunta...

            </h2>

            <div id="respostas">

            </div>

        </section>

        <!-- FEEDBACK -->

        <section id="feedback">

        </section>

    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="storage-utils.js"></script>
    <script src="potencia.js"></script>

</body>

</html>
