<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plano Cartesiano</title>

<link rel="stylesheet" href="planocartesiano.css">

</head>

<body>

<!-- TOPO -->

<header class="topo">

    <button onclick="voltar()">
        ⬅ Voltar
    </button>

    <h1>
        📈 Plano Cartesiano
    </h1>

    <button onclick="proximaFase()">
        Próximo ➡
    </button>

</header>

<!-- INFORMAÇÕES -->

<section class="info">

    <div class="box">
        ⭐ Pontos:
        <span id="pontos">0</span>
    </div>

    <div class="box">
        📚 Fase:
        <span id="fase">1</span>
    </div>

</section>

<!-- PERGUNTA -->

<section class="pergunta-area">

    <h2 id="pergunta">
        Marque os pontos da função:
    </h2>

    <h3 id="funcao">
        y = x + 1
    </h3>

</section>

<!-- JOGO -->

<section class="jogo-area">

    <!-- AVATAR -->

    <div class="avatar-area">

        <div class="fala">
            Clique nos pontos para formar a reta.
        </div>

        <img
        src="img/avatar.png"
        class="avatar">

    </div>

    <!-- CANVAS -->

    <div class="canvas-area">

        <canvas id="canvas"></canvas>

    </div>

    <!-- LIBRAS -->

    <div class="libras">

        <h2>🤟 Libras</h2>

        <img src="img/libras.png">

    </div>

</section>

<!-- MENSAGEM -->

<section class="mensagem">

    <h2 id="mensagem"></h2>

</section>

<script src="planocartesiano.js"></script>

</body>
</html>
