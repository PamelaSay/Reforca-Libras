<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conteúdos de Matemática em Libras do Reforça Libras.">
  <title>Matemática | Reforça Libras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="matematica.css">
</head>
<body>
  <header class="topo">

  <button
    type="button"
    class="btn-voltar"
    onclick="window.history.back()"
    aria-label="Voltar"
    title="Voltar"
  >
    <img
      src="botao_retornar.png"
      alt=""
      class="btn-voltar-img"
    >
  </button>

  <img
    src="logo.png"
    alt="Reforça Libras"
    class="logo-topo"
  >

  <h1>Matemática</h1>

</header>
  <main>
    <section class="ferramentas" aria-label="Ferramentas para encontrar conteúdos">
      <label class="campo-pesquisa" for="pesquisa-conteudo">
        <span aria-hidden="true">⌕</span>
        <input id="pesquisa-conteudo" type="search" placeholder="Pesquisar um conteúdo..." autocomplete="off">
      </label>
      <p id="quantidade-conteudos" aria-live="polite"></p>
    </section>

    <section id="lista-conteudos" class="grade-conteudos" aria-live="polite"></section>

    <nav id="paginacao" class="pagination" aria-label="Paginação dos conteúdos"></nav>

    <div id="sem-resultados" class="sem-resultados" hidden>
      <span aria-hidden="true">🔎</span>
      <h3>Nenhum conteúdo encontrado</h3>
      <p>Tente pesquisar usando outra palavra.</p>
    </div>
  </main>

  <footer>
    <p>© 2026 Reforça Libras - Todos os direitos reservados.</p>
  </footer>

  <script src="conteudos-matematica.js"></script>
</body>
</html>
