
   <!-- MODAL LOGIN -->
<div id="modalLogin" class="modal">
    <div class="perfil-box">
        <span class="fechar" id="fecharLogin">×</span>
        <img src="logo.png" alt="Logo">
        <h2>Entrar</h2>

        <input id="emailLogin" type="email" placeholder="E-mail">
        <input id="senhaLogin" type="password" placeholder="Senha">
        <button onclick="entrar()">Entrar</button>

        <!-- DIVISOR -->
        <div class="divisor">
            <span>ou</span>
        </div>

        <!-- BOTÃO DO GOOGLE -->
        <div id="g_id_onload"
             data-client_id="SEU_CLIENT_ID_AQUI.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="sign_in_with"
             data-shape="pill"
             data-logo_alignment="left">
        </div>

        <p>Não possui conta? <a href="#" id="abrirCadastro">Criar cadastro</a></p>
    </div>
</div>


<!-- MODAL CADASTRO -->

<div class="perfil-box">

id="nomeCadastro"

placeholder="Senha">


<button onclick="cadastrar()">
Criar cadastro
</button>


</div>

</div>
